vessel:
  # For each vehicle stage, the Sequencer will perform the following:
  # - wait for 'pre_coasting' seconds
  # - stage (spacebar) for 'start_events' times, at 1 s delay each
  # - sleep 'ullage_time' seconds to allow for ullage burn (triggered in start events)
  # - set max throttle
  # - stage (spacebar) ONCE for ignition
  # - wait to VERIFY ignition (thrust > thrust_threshold)
  # - stage (spacebar) for 'post_ignition_events' times, at 1 s delay each
  # - wait to DETECT cutoff (thrust < thrust_threshold)
  # - stage (spacebar) for 'cutoff_events' times, at 1 s delay each
  # - wait for 'post_coasting' seconds
  # Order from lower to upper stages
  # >>> MAKE IT SO THAT SIMULATION STOPS AT FIRST STAGE BURNOUT
  stages:
  - name: ''  # optional
    pre_coasting: 0.  # s
    start_events: 0
    ullage_time: 0.  # s
    post_ignition_events: 1
    thrust_threshold: 550000.  # N
    cutoff_events: 0
    post_coasting: 0.  # s
  # Whenever the vehicle is BOTH above the minimum altitude and below the maximum
  # dynamic pressure specified, the fairings will be released through the specified
  # action group
  # >>> INHIBIT FAIRINGS FOR THIS FLIGHT
  # fairings:
  #   action_group: 9  # Incorrect group to inhibit deployment
  #   min_altitude: 50000.  # m
  #   max_dynamic_pressure: 100.  # Pa
# >>> GENERIC ASCENT PROFILE
guidance:
  launch_azimuth: 90.  # degrees
  vertical_ascent:
    altitude: 1000.  # m
  pitch_program:
    altitude: 9000.  # m
    pitch: 70.  # degrees
# Establish streams of attributes for the active vessel to be logged if required
log_data:
  sample_time: 1  # s
  vessel:  # Vessel
    m: mass
    T: thrust
    Isp: specific_impulse
  orbit:  # Vessel.orbit
    vo: speed
  flight:  # Vessel.flight(vessel.orbit.body.reference_frame)
    h: mean_altitude
    p: static_pressure
    q: dynamic_pressure
    va: speed
    Ma: mach
    CD: drag_coefficient
    D: drag
